name: mgautotech-file-service

services:
  file-service:
    image: ${FILE_SERVICE_IMAGE:-mgautotech-file-service:local}
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_REVISION: ${FILE_SERVICE_RELEASE:-local}
        NEXT_PUBLIC_AUTH_CAPTCHA_ALLOW_TEST_KEY: ${NEXT_PUBLIC_AUTH_CAPTCHA_ALLOW_TEST_KEY:-}
        NEXT_PUBLIC_AUTH_CAPTCHA_MODE: ${NEXT_PUBLIC_AUTH_CAPTCHA_MODE:-}
        NEXT_PUBLIC_BANK_ACCOUNT_NAME: ${NEXT_PUBLIC_BANK_ACCOUNT_NAME:-}
        NEXT_PUBLIC_BANK_BIC: ${NEXT_PUBLIC_BANK_BIC:-}
        NEXT_PUBLIC_BANK_IBAN: ${NEXT_PUBLIC_BANK_IBAN:-}
        NEXT_PUBLIC_BANK_NAME: ${NEXT_PUBLIC_BANK_NAME:-}
        NEXT_PUBLIC_GOOGLE_ADS_ID: ${NEXT_PUBLIC_GOOGLE_ADS_ID:-}
        NEXT_PUBLIC_GOOGLE_ADS_PURCHASE_LABEL: ${NEXT_PUBLIC_GOOGLE_ADS_PURCHASE_LABEL:-}
        NEXT_PUBLIC_GOOGLE_ADS_REGISTRATION_LABEL: ${NEXT_PUBLIC_GOOGLE_ADS_REGISTRATION_LABEL:-}
        NEXT_PUBLIC_GOOGLE_ADS_REQUEST_LABEL: ${NEXT_PUBLIC_GOOGLE_ADS_REQUEST_LABEL:-}
        NEXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${NEXT_PUBLIC_GOOGLE_ANALYTICS_ID:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
    env_file:
      - ${FILE_SERVICE_ENV_FILE:-/etc/mgautotech/file-service.env}
    environment:
      FILE_EXPERT_ANALYZER_ALLOW_PRIVATE_DOCKER_HTTP: "true"
      FILE_EXPERT_ANALYZER_URL: http://file-expert-analyzer:8010
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      FILE_SERVICE_STATIC_RELEASES_TO_KEEP: "3"
    expose:
      - "3000"
    networks:
      edge:
        aliases:
          - file-service
      backend:
    volumes:
      - static-assets:/app/.next/static
      - static-state:/app/static-state
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /app/.next/cache:rw,noexec,nosuid,nodev,size=128m,mode=0750,uid=1001,gid=1001
    init: true
    read_only: true
    restart: unless-stopped
    stop_grace_period: 20s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpu_shares: 384
    cpus: "0.85"
    mem_limit: 1024m
    mem_reservation: 256m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health/ready',{cache:'no-store'}).then(r=>{if(r.status!==200)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6
    labels:
      com.mgautotech.service: file-service
      com.mgautotech.release: ${FILE_SERVICE_RELEASE:-local}

  file-expert-analyzer:
    image: ${FILE_EXPERT_ANALYZER_IMAGE:-mgautotech-file-expert-analyzer:local}
    pull_policy: never
    build:
      context: ./file-expert-analyzer
      dockerfile: Dockerfile
    env_file:
      - ${FILE_EXPERT_ANALYZER_ENV_FILE:-/etc/mgautotech/file-expert-analyzer.env}
    environment:
      FILE_EXPERT_ANALYZER_LOCK_FILE: /tmp/mg-autotech-file-expert.lock
      FILE_EXPERT_ANALYZER_MAX_CONCURRENT: "1"
      FILE_EXPERT_ANALYZER_WALL_TIMEOUT_SECONDS: "30"
    expose:
      - "8010"
    networks:
      backend:
        aliases:
          - file-expert-analyzer
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1770,uid=10001,gid=10001
    init: true
    read_only: true
    restart: unless-stopped
    stop_grace_period: 10s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpu_shares: 192
    cpus: "0.90"
    mem_limit: 768m
    mem_reservation: 128m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=2); response.close()
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 6
    labels:
      com.mgautotech.service: file-expert-analyzer
      com.mgautotech.release: ${FILE_SERVICE_RELEASE:-local}

networks:
  edge:
    external: true
    name: mgautotech_file_service_edge
  backend:
    name: mgautotech_file_service_backend
    driver: bridge

volumes:
  static-assets:
    name: mgautotech_file_service_static_assets
  static-state:
    name: mgautotech_file_service_static_state
